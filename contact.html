  <!-- [YOUR WORKSPACE] Edit only inside this <main> tag.       -->
  
  <main>
    <section>
      <h1>Contact</h1>
       <!--form-->

    <form action="https://formspree.io/f/myeybdzz" method="post">
        <!-- input box -->
        <label for="name">Preferred Name:</label>
        <input type="text" id="name" name="name"><br><br> <!-- try <p></p> -->
        <label for="email">Email:</label>
        <input type="email" id="email" name="email">
        <br><br>

        <!-- drop down -->
        <label for="hear-about">How did you hear about our website?</label>
        <select name="reference" id="hear-about">
            <option value="linkedin">LinkedIn</option>
            <option value="facebook">Facebook</option>
            <option value="instagram">Instagram</option>
        </select>
        <!-- radio button -->
        <p> Did you enjoy your experience on Daily Aux? </p>
        <label><input type="radio" name="rating" value="yes"> Yes</label>
        <label><input type="radio" name="rating" value="no"> No</label>
        <!-- checkbox -->
        <p>Select reason for contacting us:</p>
        <label><input type="checkbox" name="hobby" value="reading"> Question about blog</label><br>
        <label><input type="checkbox" name="hobby" value="traveling"> Comment on our Team's Music Taste</label><br>
        <label><input type="checkbox" name="hobby" value="sports"> Concern </label><br>
        <label><input type="checkbox" name="hobby" value="music"> Information you think we should add to our page
        </label>
        <!-- textarea -->
        <p>
            <label for="comments">Comments:</label><br>
            <textarea rows="4" cols="40" id="comments" name="comments"></textarea>
        </p>
        <!-- submit -->
        <input type="submit" value="Submit">
    </form> 
    </section>
  </main>
